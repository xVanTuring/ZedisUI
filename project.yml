name: ZedisUI
options:
  bundleIdPrefix: tech.xvanturing
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    # Hardened Runtime is required for Developer ID notarization. Enable
    # in dev too so release doesn't surface unentitled framework / runtime
    # incompatibilities late.
    ENABLE_HARDENED_RUNTIME: YES
    # T8F5T6HKG8 = "Shenzhen Zhiqishidai Technology". Used during dev so
    # the binary has a stable Apple Development code signature across
    # rebuilds — that keeps the file-based Keychain ACL stable and kills
    # the "ZedisUI wants to access keychain" prompts. Same team is used
    # for Developer ID notarization at release time.
    DEVELOPMENT_TEAM: T8F5T6HKG8
  configs:
    Debug:
      # Apple Development auto-signing for dev. Same identity persists
      # across local rebuilds, so saved keychain items stay accessible.
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "Apple Development"
    Release:
      # Build the archive with Apple Development; the actual Developer ID
      # re-sign happens at `xcodebuild -exportArchive` time via the
      # ExportOptions.plist (method=developer-id). This matches Apple's
      # canonical Direct Distribution flow.
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "Apple Development"
      # RFC 3161 timestamp — notarization requires it. ExportOptions
      # would apply this anyway; we set it here as a belt-and-braces.
      OTHER_CODE_SIGN_FLAGS: "--timestamp"

packages:
  RediStack:
    url: https://github.com/swift-server/RediStack.git
    from: "1.6.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    from: "2.9.1"

targets:
  ZedisUI:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: ZedisUI
        CFBundleShortVersionString: "0.2.4"
        CFBundleVersion: "8"
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: "Copyright © xVanTuring 2026"
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # ── Sparkle 2 auto-updater ──────────────────────────────────
        # Appcast feed lives on `main` branch of the repo; release.sh
        # commits an updated appcast.xml as part of each release.
        SUFeedURL: "https://raw.githubusercontent.com/xVanTuring/ZedisUI/main/appcast.xml"
        # EdDSA public key — used by Sparkle to verify the downloaded
        # zip's signature before unpacking. Private key is held in the
        # release engineer's login keychain (item name "https://sparkle-project.org").
        # Regenerate via `generate_keys` from the Sparkle SPM artifact
        # bundle; see docs/release.md.
        SUPublicEDKey: "g3SCjADYsXhMN5/4hnQZ7eOawvtVoGJJsS5CFew15WQ="
        # Required for sandboxed apps: enable the Installer XPC service
        # bundled inside Sparkle.framework so updates can be applied
        # without granting the main app /Applications write access.
        SUEnableInstallerLauncherService: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.xvanturing.ZedisUI
        PRODUCT_NAME: ZedisUI
        ENABLE_APP_SANDBOX: YES
        SWIFT_STRICT_CONCURRENCY: minimal
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    entitlements:
      path: Resources/ZedisUI.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # We bind() a loopback socket to grab a free port for the SSH
        # tunnel forward, and the child `ssh` process binds the chosen
        # port itself. The sandbox treats any bind() as a server op, so
        # without this entitlement both calls fail with EPERM.
        com.apple.security.network.server: true
        com.apple.security.files.user-selected.read-write: true
        # Sparkle 2 runs its installer in an XPC service outside our
        # sandbox; communication uses Mach lookups under names derived
        # from our bundle identifier. The Sparkle docs require both
        # `-spks` (Status) and `-spki` (Installer) global names.
        # No /Applications temp-exception is needed — the XPC service
        # is what writes the new bundle.
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
    dependencies:
      - package: RediStack
        product: RediStack
      - package: Sparkle
        product: Sparkle
